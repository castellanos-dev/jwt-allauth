; The matrix is what replaces the upper bounds the dependencies used to carry: the
; package installs against whatever a project resolves, and these are the combinations
; the suite is actually run against. py310-min pins the floor declared in
; pyproject.toml, py312-lts the Django LTS, and py313-latest whatever is newest at the
; time of the run — which is the one that surfaces a breaking upstream release.
[tox]
envlist = lint, py310-min, py312-lts, py313-latest
isolated_build = true
skip_missing_interpreters = true

[testenv]
commands = python runtests.py

[testenv:py310-min]
basepython = python3.10
deps =
    Django==4.2.16
    djangorestframework==3.15.2
    ; The MFA floor, not the 65.5 of the core dependency: this suite exercises MFA, so it
    ; installs the `mfa` extra and has to respect its floor. See pyproject.toml for why
    ; that floor is higher.
    django-allauth[mfa]==65.9.0
    djangorestframework-simplejwt==5.3.1
    django-user-agents==0.4.0
    six==1.9.0
    .[test,mfa]

[testenv:py312-lts]
basepython = python3.12
deps =
    Django>=5.2,<6.0
    .[test,mfa,schema]

[testenv:py313-latest]
basepython = python3.13
deps =
    .[test,mfa,schema]

[testenv:lint]
basepython = python3.12
deps =
    flake8
commands =
    flake8 . --config=setup.cfg --count --max-complexity=10 --max-line-length=120 --statistics
