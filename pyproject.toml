[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "django-jwt-allauth"
version = "1.4.0"
authors = [
    {name = "Fernando Castellanos", email = "fcastellanos.dev@gmail.com"},
]
description = "Device-level session management for Django REST Framework: rotating JWT refresh tokens on a whitelist, where a replayed token revokes the whole session."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = [
    "django",
    "rest",
    "auth",
    "registration",
    "rest-framework",
    "django-registration",
    "api",
    "allauth",
    "jwt",
    "whitelist",
    "refresh-token",
    "token-rotation",
    "session-management",
    "security",
    "mfa",
    "totp"
]
# Upper bounds are deliberately absent. A cap in a library propagates to every project
# that depends on it, blocks the security releases of the capped package, and guards
# against a break that may never happen; `Django<6.0` alone kept this package off two
# Django majors for eight months over one renamed keyword argument. The majors this
# release was actually tested against are declared in the classifiers above and checked
# at startup — see jwt_allauth.checks.check_upstream_versions.
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.15",
    "django-allauth>=65.5",
    "djangorestframework-simplejwt>=5.3.1",
    "django-user-agents>=0.4",
]

[project.optional-dependencies]
mfa = ["django-allauth[mfa]>=65.5,<66.0", "fido2<2.0.0"]
schema = ["drf-spectacular>=0.27,<1.0"]
test = ["responses>=0.5.0"]

[project.urls]
Homepage = "https://github.com/castellanos-dev/jwt-allauth"
Repository = "https://github.com/castellanos-dev/jwt-allauth"
Documentation = "https://jwt-allauth.readthedocs.io/"

[project.scripts]
jwt-allauth = "jwt_allauth.bin.jwt_allauth:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests*", "jwt_allauth.migrations*"]
include = ["jwt_allauth*"]

[tool.setuptools.package-data]
jwt_allauth = [
    "templates/**/*.html",
    "templates/**/*.txt",
    "locale/**/*.po",
]