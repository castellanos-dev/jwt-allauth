[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "django-jwt-allauth"
version = "1.4.0"
authors = [
    {name = "Fernando Castellanos", email = "fcastellanos.dev@gmail.com"},
]
description = "Device-level session management for Django REST Framework: rotating JWT refresh tokens on a whitelist, where a replayed token revokes the whole session."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = [
    "django",
    "rest",
    "auth",
    "registration",
    "rest-framework",
    "django-registration",
    "api",
    "allauth",
    "jwt",
    "whitelist",
    "refresh-token",
    "token-rotation",
    "session-management",
    "security",
    "mfa",
    "totp"
]
# No upper bounds, by policy: a cap in a library propagates a conflict to every project
# downstream and blocks the capped package's security releases. The majors each release
# is tested against are the classifiers above, and jwt_allauth.checks.check_upstream_versions
# warns at startup when an installed one is newer.
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.15",
    "django-allauth>=65.5",
    "djangorestframework-simplejwt>=5.3.1",
    "django-user-agents>=0.4",
]

[project.optional-dependencies]
# MFA needs a higher allauth floor than the rest of the library. Up to 65.8 allauth asked
# for `fido2>=1.1.2` with no upper bound, and fido2 2.0 dropped the
# `features.webauthn_json_mapping` flag it sets when its WebAuthn module is imported, so
# that pair raises AttributeError on any request touching allauth.mfa. 65.9 is the first
# allauth that bounds fido2 itself. Do not lower this floor.
mfa = ["django-allauth[mfa]>=65.9"]
# `allauth.socialaccount` ships with django-allauth, but the HTTP stack it needs does
# not: requests, the OAuth client and pyjwt[crypto] sit behind allauth's own
# `socialaccount` extra. Without them the app is importable and the endpoints are not.
# pyjwt is not a second JWT library -- simplejwt already depends on it. What the extra
# adds is `cryptography`, which PyJWT needs for the RS256/ES256 signatures an id_token
# carries; simplejwt signs with HS256 by default and never needed it.
social = ["django-allauth[socialaccount]>=65.9"]
schema = ["drf-spectacular>=0.27,<1.0"]
test = ["responses>=0.5.0"]

[project.urls]
Homepage = "https://github.com/castellanos-dev/jwt-allauth"
Repository = "https://github.com/castellanos-dev/jwt-allauth"
Documentation = "https://jwt-allauth.readthedocs.io/"

[project.scripts]
jwt-allauth = "jwt_allauth.bin.jwt_allauth:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests*", "jwt_allauth.migrations*"]
include = ["jwt_allauth*"]

[tool.setuptools.package-data]
jwt_allauth = [
    "templates/**/*.html",
    "templates/**/*.txt",
    "locale/**/*.po",
]