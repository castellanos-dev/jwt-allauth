# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: TestsAndLint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    environment:
      name: development

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: |
          3.12
          3.13
    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        pip install tox
    # py313-latest resolves to whatever is current on the day it runs, so a breaking
    # upstream release surfaces here rather than in someone's installation.
    - name: Run lint, LTS and latest-deps tests via tox
      run: |
        tox -e lint,py312-lts,py313-latest
